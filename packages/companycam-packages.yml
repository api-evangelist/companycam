notes: >-
  CompanyCam maintains no actively-published, registry-distributed API client
  SDK. The one first-party client wrapper is the .NET library
  CompanyCam/companycam-dotnet (now archived, source-only). CompanyCam also
  publishes an official OpenAPI 3.0 spec and an official Postman collection, from
  which typed clients can be generated. Third-party community clients exist on npm
  (companycam by PWI-Works, n8n-nodes-companycam) but are not first-party.
