aid: companycam
name: CompanyCam
description: >-
  CompanyCam is a photo-based job-site documentation platform for contractors and
  the trades — roofing, restoration, solar, home services and construction. Its
  mobile apps capture location- and time-stamped photos and videos that sync to a
  shared, project-organized workspace so crews, offices and clients stay aligned.
  The CompanyCam Core API (v2) is a REST API over projects, photos, videos, users,
  groups, tags, comments, documents, checklists and webhooks, secured with Bearer
  access tokens or OAuth 2.0 (authorization-code with PKCE and refresh tokens). It
  publishes an official OpenAPI 3.0 description, a Postman collection, granular
  per-resource OAuth scopes advertised via RFC 8414 metadata, HMAC-signed
  webhooks, and per-method rate limits. CompanyCam is backed by Insight Partners.
